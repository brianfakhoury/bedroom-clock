[project]
name = "bedroom-clock-tools"
version = "0.12.0"
requires-python = ">=3.12"
dependencies = ["esptool==4.12.0", "pyserial==3.5"]

[project.scripts]
clock = "tools.clock:main"
setup = "tools.setup:main"
esptool = "esptool:_main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tools"
module-root = ""
namespace = true

[dependency-groups]
dev = ["pytest>=9.2.0"]
