name: Firmware
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustup installs the toolchain pinned in rust-toolchain.toml on first use
      - run: cargo firmware
      - run: cargo test
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- --deny warnings
      - run: cargo clippy --release --package bedroom-clock --target riscv32imac-unknown-none-elf -- --deny warnings
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            target/clock.bin
            target/clock.elf
            target/clock.map
