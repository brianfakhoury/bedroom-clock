name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustup installs the toolchain pinned in rust-toolchain.toml on first use
      - run: cargo xtask build
      - run: cargo test
      - run: |
          gh release create "$GITHUB_REF_NAME" target/clock.bin target/clock.elf target/clock.map \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-from-tag
        env:
          GH_TOKEN: ${{ github.token }}
